name: Library Source Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/discover-library-sources.mjs'
      - '.github/workflows/source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Discover public-domain source candidates
        run: node scripts/discover-library-sources.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: library-source-audit
          path: source-audit.json
          if-no-files-found: error
