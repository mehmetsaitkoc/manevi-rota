name: Render Deploy Secret Probe

on:
  push:
    branches: ['gpt/render-deploy-probe']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      HOOK_ALT: ${{ secrets.RENDER_DEPLOY_HOOK }}
      API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          test -n "$HOOK_URL" && hook_url=1 || hook_url=0
          test -n "$HOOK_ALT" && hook_alt=1 || hook_alt=0
          test -n "$API_KEY" && api_key=1 || api_key=0
          test -n "$SERVICE_ID" && service_id=1 || service_id=0
          echo "render_secret_presence hook_url=$hook_url hook_alt=$hook_alt api_key=$api_key service_id=$service_id"
