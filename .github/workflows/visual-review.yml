name: Visual Review
# final-library-reader-check
# premium-library-final-check
# post-ocr-asset-check

on:
  push:
    branches: [main, 'gpt/**']
    paths:
      - '.github/workflows/visual-review.yml'
      - 'public/app.js'
      - 'public/styles.css'
      - 'public/index.html'
      - 'src/kirk-hadis.mjs'
      - 'src/quran-reader.mjs'
      - 'src/library-catalog.mjs'
      - 'src/book-reader.mjs'
      - 'src/ilim-notebook.mjs'
      - 'scripts/ilim-notebook.mjs'
      - 'src/reading-recommendation.mjs'
      - 'scripts/reading-recommendation.mjs'
      - 'src/reading-recommendation-memory.mjs'
      - 'scripts/reading-recommendation-memory.mjs'
      - 'scripts/reading-recommendation-closed-loop.mjs'
      - 'src/today-experience.mjs'
      - 'scripts/today-experience.mjs'
      - 'src/library-path.mjs'
      - 'scripts/library-catalog.mjs'
      - 'scripts/book-reader.mjs'
      - 'scripts/library-path.mjs'
      - 'src/pilot-telemetry.mjs'
      - 'scripts/pilot-telemetry.mjs'
      - 'scripts/pilot-server.mjs'
      - 'server.mjs'
      - 'scripts/quran-reader.mjs'
      - 'public/data/**'
      - 'public/data/books/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          PORT=4173 node server.mjs > /tmp/manevi-rota-server.log 2>&1 &
          echo $! > /tmp/manevi-rota-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/manevi-rota-server.log
          exit 1
      - name: Capture real UI
        run: |
          mkdir -p visual-review
          cat > capture.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            const url='http://127.0.0.1:4173/';
            const key='manevi-rota-v2.7';
            await page.goto(url,{waitUntil:'networkidle'});
            const firstImpression=await page.getAttribute('#mrIntro','data-first-impression');
            if(firstImpression!=='v2.1')throw new Error('Premium first-impression marker missing');
            const introPrimary=page.locator('.mr-ctaRow .mr-cta:not(.secondary)');
            const proofRows=await page.locator('.mr-proofRow>span').count();
            if(proofRows!==3)throw new Error('First fold must show exactly three product proof points');
            const introCtaBox=await introPrimary.boundingBox();
            if(!introCtaBox||introCtaBox.y+introCtaBox.height>844)throw new Error('Primary first-impression CTA is below the 390x844 first fold');
            await page.screenshot({path:'visual-review/00-intro.png',fullPage:true});
            await page.screenshot({path:'visual-review/00a-intro-first-fold.png'});

            await introPrimary.click();
            await page.waitForSelector('.onboardingCard[data-onboarding-step="1"]',{timeout:5000});
            const onboardingSteps=await page.locator('.onboardingCard .step').count();
            if(onboardingSteps!==8)throw new Error('Onboarding must preserve eight setup steps');
            const firstQuestion=await page.locator('.onboardingPrompt h1').innerText();
            if(!firstQuestion.includes('Manevî düzenin'))throw new Error('Onboarding first question changed unexpectedly');
            const onboardActionsBox=await page.locator('.onboardingActions').boundingBox();
            if(!onboardActionsBox||onboardActionsBox.y+onboardActionsBox.height>844)throw new Error('Onboarding actions are below the 390x844 first fold');
            if(await page.locator('#nav:not(.hidden)').count())throw new Error('Navigation must remain hidden during onboarding');
            const onboardingVisual=await page.locator('.onboardingCard .opt').first().evaluate(el=>({
              background:getComputedStyle(el).backgroundImage,
              color:getComputedStyle(el).color
            }));
            if(!onboardingVisual.background.includes('linear-gradient'))throw new Error('Premium onboarding option surface regressed to a flat/light card');
            const onboardingColor=(onboardingVisual.color.match(/\d+/g)||[]).slice(0,3).map(Number);
            if(onboardingColor.length<3||onboardingColor.some(v=>v<180))throw new Error('Premium onboarding option text contrast regressed');
            await page.screenshot({path:'visual-review/00b-onboarding-first-fold.png'});

            // Walk the real first-run setup to guard the handoff into daily calibration.
            await page.click('[data-o="steady"]'); await page.click('#next');
            await page.click('[data-o="20"]'); await page.click('#next');
            await page.click('[data-o="regular"]'); await page.click('#next');
            await page.click('[data-o="regular"]'); await page.click('#next');
            await page.click('[data-m="quran"]'); await page.click('[data-m="reading"]'); await page.click('#next');
            await page.click('[data-o="false"]'); await page.click('#next');
            await page.click('[data-o="variable"]'); await page.click('#next');
            await page.click('[data-o="balanced"]'); await page.click('#next');
            await page.waitForSelector('#app .card',{timeout:5000});
            const firstRunText=await page.locator('#app').innerText();
            if(!firstRunText.includes('Bugün sana göre.')||!firstRunText.includes('Bugün gerçekten kaç dakikan var?'))throw new Error('First-run handoff did not reach daily check-in');
            await page.screenshot({path:'visual-review/00c-first-run-checkin.png',fullPage:true});
            await page.click('#normalDay');
            await page.waitForFunction(()=>document.querySelector('.checkinProgressPill')?.innerText.includes('5/5'),null,{timeout:5000});
            if(await page.locator('#go').isDisabled())throw new Error('Daily calibration did not enable route analysis after normal-day preset');
            await page.locator('.checkinActions').scrollIntoViewIfNeeded();
            await page.waitForTimeout(100);
            const checkinActionsBox=await page.locator('.checkinActions').boundingBox();
            const checkinNavBox=await page.locator('#nav').boundingBox();
            if(checkinActionsBox&&checkinNavBox&&checkinActionsBox.y+checkinActionsBox.height>checkinNavBox.y)throw new Error('Daily calibration actions are obscured by mobile navigation');
            await page.screenshot({path:'visual-review/00d-first-run-checkin-ready.png'});

            const now=new Date();
            const iso=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);
            const state={
              onboardStep:7,onboardDone:true,
              profile:{
                rhythm:'steady',baseMinutes:20,quranLevel:'regular',reading:'regular',
                priorities:['reading'],prayerTracking:false,
                blocker:'variable',pace:'balanced',slotOverrides:{},slotSuggestionSnooze:{}
              },
              daily:{},
              view:'today',
              prayer:{location:{city:'',country:'Turkey',lat:null,lng:null,label:''},today:null,tomorrow:null,lastFetched:null,error:null},
              qada:{},
              ilim:{},
              library:{
                books:{'islam-dini':{page:120}},
                lastBook:'islam-dini',
                recommendationMemory:{active:null,history:[]}
              }
            };
            state.daily[iso]={checkin:{minutes:20,energy:3,load:3,mood:'normal',context:'normal'},done:[],taskFeedback:{},feedback:null,route:null,lightDay:false};
            await page.evaluate(([k,s])=>{
              localStorage.setItem(k,JSON.stringify(s));
              sessionStorage.setItem('manevi-rota-intro-seen','1');
            },[key,state]);
            await page.reload({waitUntil:'networkidle'});
            await page.waitForSelector('#app .todayPlanBar',{timeout:10000});
            await page.waitForSelector('.readingRecommendationCard',{timeout:5000});
            const todayPlanUi=await page.getAttribute('.todayPlanBar','data-ui');
            if(todayPlanUi!=='today-plan-v2.2')throw new Error('V2.2 compact Today plan marker missing');
            const todayPlanBox=await page.locator('.todayPlanBar').boundingBox();
            if(todayPlanBox&&todayPlanBox.height>150)throw new Error('V2.2 Today plan summary became too tall on 390px mobile');
            const editorialUi=await page.getAttribute('#productApp','data-ui');
            if(editorialUi!=='editorial-v1')throw new Error('Premium editorial UI marker missing');
            const designUi=await page.getAttribute('#productApp','data-design');
            if(designUi!=='premium-night-v3')throw new Error('Premium night v3 design marker missing');
            const homeHero=page.locator('.homeNightHero[data-ui="premium-home-v3"]');
            if(await homeHero.count()!==1)throw new Error('Premium home journey hero missing');
            const homeHeroText=await homeHero.innerText();
            if(!homeHeroText.includes('Manevî Rotan')||!homeHeroText.includes('Her güzel yolculuk'))throw new Error('Premium home hero copy regressed');
            const navGlyphs=await page.locator('#nav .navGlyph').count();
            if(navGlyphs!==5)throw new Error('Premium navigation must use five primary destinations');
            if(await page.locator('#nav [data-view="checkin"]').count()!==0)throw new Error('Daily calibration should be reachable from Today, not consume a primary nav slot');
            if(await page.locator('#edit').count()!==1)throw new Error('Today must retain the direct daily-calibration action');
            await page.waitForFunction((k)=>Number(JSON.parse(localStorage.getItem(k)||'{}').library?.books?.['islam-dini']?.totalPages||0)>0,key,{timeout:10000});
            const hydratedTotal=await page.evaluate((k)=>Number(JSON.parse(localStorage.getItem(k)).library?.books?.['islam-dini']?.totalPages||0),key);
            if(hydratedTotal<=120)throw new Error('Legacy generic-book progress did not hydrate totalPages before recommendation ranking');
            const readingRecommendationText=await page.locator('.readingRecommendationCard').innerText();
            if(!readingRecommendationText.includes('BUGÜN SANA ÖNERİM')||!readingRecommendationText.includes('Okumaya Başla'))throw new Error('Today v2 primary recommendation card is incomplete');
            if(!readingRecommendationText.includes('İslâm Dini')||!readingRecommendationText.includes('Okuma 120'))throw new Error('Today recommendation did not preserve the legacy reader location');
            const readingRecommendationCount=await page.locator('.readingRecommendationCard').count();
            if(readingRecommendationCount!==1)throw new Error('Today view must show exactly one primary reading recommendation');
            const recommendationBox=await page.locator('.readingRecommendationCard').boundingBox();
            const navBox=await page.locator('#nav').boundingBox();
            if(recommendationBox&&navBox&&recommendationBox.y+recommendationBox.height>navBox.y)throw new Error('Primary reading recommendation is obscured by mobile navigation');
            await page.screenshot({path:'visual-review/01-today.png',fullPage:true});
            await page.screenshot({path:'visual-review/01a-reading-recommendation.png',fullPage:true});

            await page.click('#startReadingRecommendation');
            await page.waitForSelector('.genericBookPaper',{timeout:10000});
            const recommendedPage=await page.locator('#genericBookPageInput').inputValue();
            if(recommendedPage!=='120')throw new Error('Recommendation CTA did not open the exact persisted book location: '+recommendedPage);
            const activeRecommendation=await page.evaluate((k)=>JSON.parse(localStorage.getItem(k)).library?.recommendationMemory?.active,key);
            if(activeRecommendation?.bookId!=='islam-dini'||activeRecommendation?.kind!=='book')throw new Error('Recommendation CTA did not persist the active reading recommendation');
            const utilityDrawer=page.locator('.genericBookUtilityDrawer');
            if(await utilityDrawer.count()!==1)throw new Error('Generic reader secondary utility drawer missing');
            if(await utilityDrawer.getAttribute('open')!==null)throw new Error('Generic reader secondary utility drawer must be collapsed by default');
            const paperBox=await page.locator('.genericBookPaper').boundingBox();
            if(paperBox&&paperBox.y>430)throw new Error('Generic reader content starts too low on 390x844 mobile');
            await page.screenshot({path:'visual-review/01aa-recommendation-reader.png',fullPage:true});
            await page.click('#genericBookBack');
            await page.waitForSelector('.simpleLibraryGrid',{timeout:10000});
            const memoryAfterExit=await page.evaluate((k)=>JSON.parse(localStorage.getItem(k)).library?.recommendationMemory,key);
            if(memoryAfterExit?.active)throw new Error('Early reader exit left a stale active recommendation');
            if(!memoryAfterExit?.history?.some(x=>x.bookId==='islam-dini'&&x.status==='abandoned'))throw new Error('Early reader exit was not persisted as abandoned');
            await page.click('#simpleLibraryBack');
            await page.waitForSelector('#openSimpleNotebook',{timeout:10000});
            await page.click('#openSimpleNotebook');
            await page.waitForSelector('.notebookToolbar',{timeout:10000});
            await page.screenshot({path:'visual-review/01ab-recommendation-to-notebook.png',fullPage:true});
            await page.evaluate((k)=>{
              const s=JSON.parse(localStorage.getItem(k));s.view='today';s.ilim=s.ilim||{};s.ilim.ui={...(s.ilim.ui||{}),screen:'home'};s.library.recommendationDay=null;s.library.recommendationIndex=0;localStorage.setItem(k,JSON.stringify(s));
            },key);
            await page.reload({waitUntil:'networkidle'});
            await page.waitForSelector('.readingRecommendationCard',{timeout:10000});

            const alternate=page.locator('#nextReadingRecommendation');
            if(await alternate.count()){
              const beforeTitle=await page.locator('.readingRecommendationCard h1').innerText();
              await alternate.click();
              await page.waitForTimeout(120);
              const afterTitle=await page.locator('.readingRecommendationCard h1').innerText();
              if(afterTitle===beforeTitle)throw new Error('Alternate reading recommendation did not rotate');
              const memoryAfterSkip=await page.evaluate((k)=>JSON.parse(localStorage.getItem(k)).library?.recommendationMemory,key);
              if(!memoryAfterSkip?.history?.some(x=>x.status==='skipped'))throw new Error('Alternate recommendation choice did not persist an explicit skip signal');
            }

            await page.evaluate(([k,iso])=>{
              const s=JSON.parse(localStorage.getItem(k));
              const yesterday=new Date(iso+'T12:00:00Z');yesterday.setUTCDate(yesterday.getUTCDate()-1);
              const y=yesterday.toISOString().slice(0,10);
              s.library=s.library||{};
              s.library.recommendationMemory={
                active:null,
                history:[
                  {id:'vr-today',date:iso,bookId:'islam-dini',kind:'book',title:'İslâm Dini',recommendedMinutes:8,rank:1,status:'completed',actualMinutes:7,feedback:'ideal',createdAt:iso+'T18:07:00.000Z'},
                  {id:'vr-yesterday',date:y,bookId:'islam-dini',kind:'book',title:'İslâm Dini',recommendedMinutes:8,rank:1,status:'completed',actualMinutes:6,feedback:'easy',createdAt:y+'T18:06:00.000Z'}
                ]
              };
              s.daily=s.daily||{};
              s.daily[y]={checkin:{minutes:20,energy:3,load:3,mood:'normal',context:'normal'},done:['reading'],taskFeedback:{reading:'normal'},feedback:'ideal',route:null,lightDay:false,readingSessions:[{id:'vr-session',bookId:'islam-dini',date:y,minutes:6,pages:3,feedback:'easy'}]};
              localStorage.setItem(k,JSON.stringify(s));
            },[key,iso]);
            await page.reload({waitUntil:'networkidle'});
            await page.waitForSelector('.todayPrimaryCard.completed',{timeout:10000});
            const completedTodayText=await page.locator('.todayPrimaryCard.completed').innerText();
            if(!completedTodayText.includes('BUGÜN TAMAMLANDI')||!completedTodayText.includes('7 dk'))throw new Error('Today completed state did not render real reading outcome');
            const completionSurface=await page.locator('.todayCompletionStats>span').first().evaluate(el=>getComputedStyle(el).backgroundColor);
            const completionRgb=(completionSurface.match(/\d+/g)||[]).slice(0,3).map(Number);
            if(completionRgb.length<3||completionRgb.some(v=>v>90))throw new Error('Today completion stats regressed to a light material surface');
            const yesterdayText=await page.locator('.todayYesterdayCard').innerText();
            if(!yesterdayText.includes('DÜN NE OLDU?')||!yesterdayText.includes('6 dk')||!yesterdayText.includes('3 sayfa'))throw new Error('Yesterday reading summary did not render');
            await page.screenshot({path:'visual-review/01b-today-completed.png',fullPage:true});

            await page.evaluate((k)=>{
              const s=JSON.parse(localStorage.getItem(k));s.view='ilim';localStorage.setItem(k,JSON.stringify(s));
            },key);
            await page.reload({waitUntil:'networkidle'});
            await page.waitForSelector('#app .libraryHero',{timeout:10000});
            await page.screenshot({path:'visual-review/02-ilim.png',fullPage:true});

            const premiumLibraryUi=await page.getAttribute('.premiumLibraryHero','data-ui');
            if(premiumLibraryUi!=='premium-library-v4')throw new Error('Simplified Ilim v4 marker missing');
            const simpleActions=await page.locator('.ilimSimpleAction').count();
            if(simpleActions!==3)throw new Error('Ilim home must expose exactly three primary actions, got '+simpleActions);
            if(await page.locator('[data-starter-book]').count()!==0)throw new Error('Book catalog must not crowd the Ilim home screen');
            if(await page.locator('.libraryV2Rail,.libraryLevelCard,.memorySummary').count()!==0)throw new Error('Legacy dense library surfaces leaked into simplified Ilim home');
            await page.click('#openSimpleLibrary');
            await page.waitForSelector('.simpleLibraryGrid',{timeout:5000});
            const shelfCount=await page.locator('[data-starter-book]').count();
            if(shelfCount!==9)throw new Error('Simple library must render the 9 ready works, got '+shelfCount);
            const pendingSummary=await page.locator('.simpleLibraryPending summary').innerText();
            if(!pendingSummary.includes('1 eser'))throw new Error('Source-pending work must stay separated from the readable library');
            await page.screenshot({path:'visual-review/02a-simple-library.png',fullPage:true});

            await page.click('#simpleLibraryBack');
            await page.evaluate((k)=>{
              const s=JSON.parse(localStorage.getItem(k));
              s.library=s.library||{};
              s.library.path={...(s.library.path||{}),completedBooks:['islam-dini'],completedAt:{'islam-dini':new Date().toISOString()},acknowledgedLevel:1};
              localStorage.setItem(k,JSON.stringify(s));
            },key);
            await page.reload({waitUntil:'networkidle'});
            await page.waitForSelector('.levelTransitionCard',{timeout:5000});
            const transitionText=await page.locator('.levelTransitionCard').innerText();
            if(!transitionText.includes('SEVİYE 1 TAMAMLANDI')||!transitionText.includes('Seviye 2'))throw new Error('Level transition card did not appear correctly');
            await page.click('#ackLibraryLevel');
            await page.waitForTimeout(160);
            const acknowledgedLevel=await page.evaluate((k)=>JSON.parse(localStorage.getItem(k)).library?.path?.acknowledgedLevel,key);
            if(acknowledgedLevel!==2)throw new Error('Level transition acknowledgement was not persisted');
            await page.click('#openSimpleLibrary');
            await page.waitForSelector('.simpleLibraryGrid',{timeout:5000});
            const yavrularButton=page.locator('[data-starter-book="yavrularimiza-din-dersleri"]');
            if(await yavrularButton.isDisabled())throw new Error('Yavrularımıza Din Dersleri should be readable');
            await yavrularButton.click();
            await page.waitForSelector('.genericBookPaper',{timeout:10000});
            await page.waitForTimeout(80);
            const readerScrollY=await page.evaluate(()=>window.scrollY);
            if(readerScrollY>4)throw new Error('Library-to-reader transition did not reset viewport to the top');
            const yavrularTitle=await page.locator('.genericBookTitleCard h1').innerText();
            if(!yavrularTitle.includes('Yavrularımıza Din Dersleri'))throw new Error('Yavrularımız reader title mismatch');
            const sourceEdition=await page.locator('.genericBookEdition').innerText();
            if(!sourceEdition.includes('1967'))throw new Error('Yavrularımız source edition disclosure missing');
            await page.screenshot({path:'visual-review/03-yavrularimiz-reader.png',fullPage:true});
            await page.click('#genericBookBack');
            await page.waitForSelector('[data-starter-book="namaz-sureleri-tefsiri"]',{timeout:10000});

            const fitriButton=page.locator('[data-starter-book="islam-fitri-tabii-umumi"]');
            if(await fitriButton.isDisabled())throw new Error('Islam Fitri should be readable');
            await fitriButton.click();
            await page.waitForSelector('.genericBookPaper',{timeout:10000});
            const fitriTitle=await page.locator('.genericBookTitleCard h1').innerText();
            if(!fitriTitle.includes('Fıtrî')&&!fitriTitle.includes('Fıtri'))throw new Error('Islam Fitri reader title mismatch');
            const fitriText=await page.locator('.genericBookPaper').innerText();
            if(!fitriText.includes('ÖN SÖZ'))throw new Error('Islam Fitri reader did not start from author preface');
            await page.screenshot({path:'visual-review/03a-islam-fitri-reader.png',fullPage:true});
            await page.click('#genericBookBack');
            await page.waitForSelector('[data-starter-book="namaz-sureleri-tefsiri"]',{timeout:10000});

            const tanriButton=page.locator('[data-starter-book="tanri-buyrugu"]');
            if(await tanriButton.isDisabled())throw new Error('Tanri Buyrugu should be readable');
            await tanriButton.click();
            await page.waitForSelector('.genericBookPaper',{timeout:10000});
            const tanriTitle=await page.locator('.genericBookTitleCard h1').innerText();
            if(!tanriTitle.includes('Tanrı Buyruğu'))throw new Error('Tanri Buyrugu reader title mismatch');
            const tanriText=await page.locator('.genericBookPaper').innerText();
            if(!tanriText.includes('BİRİNCİ BÖLÜM')||!/KUR.?AN/.test(tanriText))throw new Error('Tanri Buyrugu reader start is not the verified author text');
            const tanriEdition=await page.locator('.genericBookEdition').innerText();
            if(!tanriEdition.includes('1955'))throw new Error('Tanri Buyrugu historical edition disclosure missing');
            await page.screenshot({path:'visual-review/03aa-tanri-buyrugu-reader.png',fullPage:true});
            await page.click('#genericBookBack');
            await page.waitForSelector('[data-starter-book="kurandan-ayetler"]',{timeout:10000});

            const kurandanButton=page.locator('[data-starter-book="kurandan-ayetler"]');
            if(await kurandanButton.isDisabled())throw new Error('Kurandan Ayetler should be readable');
            await kurandanButton.click();
            await page.waitForSelector('.genericBookPaper',{timeout:10000});
            const kurandanTitle=await page.locator('.genericBookTitleCard h1').innerText();
            if(!kurandanTitle.includes('Kur’an’dan Âyetler'))throw new Error('Kurandan Ayetler reader title mismatch: '+kurandanTitle);
            const kurandanText=await page.locator('.genericBookPaper').innerText();
            if(!/On Söz|ÖN SÖZ/.test(kurandanText)||!/Mehmet Akif|Mehmet Âkif/.test(kurandanText))throw new Error('Kurandan Ayetler reader did not start from verified 1944 text');
            const kurandanEdition=await page.locator('.genericBookEdition').innerText();
            if(!kurandanEdition.includes('1944'))throw new Error('Kurandan Ayetler historical edition disclosure missing');
            await page.evaluate(()=>window.scrollTo(0,0));
            await page.waitForTimeout(120);
            await page.screenshot({path:'visual-review/03ab-kurandan-ayetler-reader.png',fullPage:true});
            await page.click('#genericBookBack');
            await page.waitForSelector('[data-starter-book="namaz-sureleri-tefsiri"]',{timeout:10000});

            await page.click('[data-starter-book="namaz-sureleri-tefsiri"]');
            await page.waitForSelector('.genericBookPaper',{timeout:10000});
            await page.click('[data-book-highlight="1"]');
            await page.click('[data-book-note="1"]');
            await page.fill('#genericBookNoteInput','Visual review — kişisel kitap notu');
            await page.click('#genericBookNoteSave');
            await page.evaluate(()=>window.scrollTo(0,0));
            await page.waitForTimeout(120);
            await page.screenshot({path:'visual-review/03-premium-book.png',fullPage:true});
            await page.click('#genericBookFocus');
            await page.waitForSelector('.genericBookFocusMode',{timeout:5000});
            await page.evaluate(()=>window.scrollTo(0,0));
            await page.waitForTimeout(120);
            await page.screenshot({path:'visual-review/03b-premium-book-focus.png',fullPage:true});
            await page.click('#genericBookFocus');
            const completeInitiallyDisabled=await page.locator('#genericBookComplete').isDisabled();
            if(!completeInitiallyDisabled)throw new Error('Book completion must stay disabled before the last 15 percent');
            const maxPage=Number(await page.locator('#genericBookPageInput').getAttribute('max'));
            await page.locator('#genericBookPageInput').fill(String(maxPage));
            await page.locator('#genericBookPageInput').dispatchEvent('change');
            await page.waitForTimeout(180);
            if(await page.locator('#genericBookComplete').isDisabled())throw new Error('Book completion did not unlock near the end');
            await page.click('#genericBookComplete');
            const pathState=await page.evaluate((k)=>JSON.parse(localStorage.getItem(k)).library?.path,key);
            if(!pathState?.completedBooks?.includes('namaz-sureleri-tefsiri'))throw new Error('Completed book was not persisted in library path state');
            await page.evaluate(()=>window.scrollTo(0,0));
            await page.waitForTimeout(100);
            await page.screenshot({path:'visual-review/03c-premium-book-completed.png',fullPage:true});
            await page.click('#genericBookBack');
            await page.waitForSelector('[data-starter-book="quran"]',{timeout:10000});
            const resumeTitle=await page.locator('.continueReadingCard h2').innerText();
            if(!resumeTitle.includes('Namaz Sûrelerinin'))throw new Error('Last-read library card did not resume the actual book: '+resumeTitle);
            const completedCard=page.locator('[data-starter-book="namaz-sureleri-tefsiri"].completed');
            if(await completedCard.count()!==1)throw new Error('Completed library book card did not update');
            if(await completedCard.locator('.starterBookBadges .done').count()!==1)throw new Error('Completed library book badge did not update');
            await page.screenshot({path:'visual-review/03d-library-level-progress.png',fullPage:true});

            await page.evaluate(([k,iso])=>{
              const s=JSON.parse(localStorage.getItem(k));
              s.library=s.library||{};
              const history=Array.isArray(s.library.recommendationMemory?.history)?s.library.recommendationMemory.history.filter(x=>x.date!==iso):[];
              s.library.recommendationMemory={
                active:{id:'vr-quran-active',date:iso,bookId:'quran',kind:'quran',title:'Kur’ân-ı Kerîm',recommendedMinutes:6,rank:1,startedAt:iso+'T18:00:00.000Z'},
                history
              };
              s.view='ilim';s.ilim=s.ilim||{};s.ilim.ui={...(s.ilim.ui||{}),screen:'home'};
              localStorage.setItem(k,JSON.stringify(s));
            },[key,iso]);
            await page.reload({waitUntil:'networkidle'});
            await page.waitForSelector('[data-starter-book="quran"]',{timeout:10000});
            await page.click('[data-starter-book="quran"]');
            await page.waitForSelector('.quranAyah',{timeout:10000});
            await page.waitForSelector('.quranSessionCard',{timeout:5000});
            const quranSessionText=await page.locator('.quranSessionCard').innerText();
            if(!quranSessionText.includes('AKTİF OKUMA OTURUMU')||!quranSessionText.includes('Tam kıvamında'))throw new Error('Quran reading session feedback card missing');
            await page.click('[data-quran-highlight="1"]');
            await page.click('[data-quran-bookmark="1"]');
            await page.click('[data-quran-note="1"]');
            await page.fill('#quranNoteInput','Visual review — kişisel not katmanı');
            await page.click('#quranNoteSave');
            const quranStored=await page.evaluate((k)=>JSON.parse(localStorage.getItem(k)).library?.quran,key);
            if(!quranStored?.bookmarks?.includes('1:1'))throw new Error('Quran verse bookmark was not persisted');
            await page.screenshot({path:'visual-review/04-quran.png',fullPage:true});
            await page.click('#quranFocus');
            await page.waitForSelector('.quranFocusMode',{timeout:5000});
            await page.screenshot({path:'visual-review/04b-quran-focus.png',fullPage:true});
            await page.click('#quranFocus');
            await page.click('[data-quran-ayah="2"]');
            await page.click('[data-quran-session-feedback="ideal"]');
            await page.waitForSelector('.todayPrimaryCard.completed',{timeout:10000});
            const quranCompletedText=await page.locator('.todayPrimaryCard.completed').innerText();
            if(!quranCompletedText.includes('BUGÜN TAMAMLANDI')||!quranCompletedText.includes('Kur’ân-ı Kerîm'))throw new Error('Recommended Quran session did not return to Today completed state');
            await page.screenshot({path:'visual-review/04bb-quran-to-today.png',fullPage:true});
            const quranOutcome=await page.evaluate((k)=>JSON.parse(localStorage.getItem(k)).library?.recommendationMemory?.history?.find(x=>x.bookId==='quran'&&x.status==='completed'),key);
            if(!quranOutcome)throw new Error('Recommended Quran completion was not persisted');

            await page.evaluate((k)=>{
              const s=JSON.parse(localStorage.getItem(k));s.view='ilim';s.ilim.ui={...(s.ilim.ui||{}),screen:'home'};localStorage.setItem(k,JSON.stringify(s));
            },key);
            await page.reload({waitUntil:'networkidle'});
            await page.waitForSelector('#openSimpleNotebook',{timeout:10000});

            await page.click('#openSimpleNotebook');
            await page.waitForSelector('.notebookToolbar',{timeout:15000});
            const notebookSummary=await page.locator('.notebookSummaryGrid').innerText();
            if(!notebookSummary.includes('not')||!notebookSummary.includes('vurgu')||!notebookSummary.includes('yer imi'))throw new Error('Ilim Defteri v2 summary missing');
            const quranGroup=page.locator('.notebookBookGroup').filter({hasText:'Kur’ân-ı Kerîm'});
            const namazGroup=page.locator('.notebookBookGroup').filter({hasText:'Namaz Sûrelerinin'});
            if(await quranGroup.count()!==1)throw new Error('Quran annotations missing from Ilim Defteri v2');
            if(await namazGroup.count()!==1)throw new Error('Generic book annotations missing from Ilim Defteri v2');
            const notebookVisual=await page.evaluate(()=>({
              input:getComputedStyle(document.querySelector('.notebookToolbar input')).backgroundColor,
              head:getComputedStyle(document.querySelector('.notebookBookHead')).backgroundImage,
              quote:getComputedStyle(document.querySelector('.notebookEntry blockquote')).backgroundImage
            }));
            const notebookInputRgb=(notebookVisual.input.match(/\d+/g)||[]).slice(0,3).map(Number);
            if(notebookInputRgb.length<3||notebookInputRgb.some(v=>v>90))throw new Error('Ilim Defteri search input regressed to a light surface');
            if(!notebookVisual.head.includes('linear-gradient')||!notebookVisual.quote.includes('linear-gradient'))throw new Error('Ilim Defteri editorial surfaces regressed');
            await page.screenshot({path:'visual-review/04c-ilim-defteri-v2.png',fullPage:true});
            await page.fill('#notebookSearchInput','Visual review');
            await page.click('#notebookSearchForm button[type="submit"]');
            await page.waitForTimeout(180);
            const visibleNotebookEntries=await page.locator('.notebookEntry').count();
            if(visibleNotebookEntries<2)throw new Error('Ilim Defteri v2 search did not find cross-book personal notes');
            await page.screenshot({path:'visual-review/04d-ilim-defteri-search.png',fullPage:true});
            await page.click('#ilimHome');
            await page.waitForSelector('[data-starter-book="islam-dini"]',{timeout:10000});

            await page.click('[data-starter-book="islam-dini"]');
            await page.waitForSelector('.genericBookPaper',{timeout:10000});
            await page.evaluate(()=>window.scrollTo(0,0));
            await page.waitForTimeout(120);
            await page.screenshot({path:'visual-review/05-islam-dini-premium.png',fullPage:true});
            await page.click('#genericBookBack');
            await page.waitForSelector('#openTodayHadis',{timeout:10000});

            await page.click('#openTodayHadis');
            await page.waitForSelector('.hadisReader',{timeout:10000});
            await page.waitForTimeout(500);
            await page.screenshot({path:'visual-review/06-hadis-reader.png',fullPage:true});

            // Prayer Center first-use + private qada tracking should share the premium night material system.
            await page.evaluate((k)=>{
              const s=JSON.parse(localStorage.getItem(k));
              s.view='prayer';
              s.profile={...(s.profile||{}),prayerTracking:true};
              s.prayer={location:{city:'',country:'Turkey',lat:null,lng:null,label:''},today:null,tomorrow:null,lastFetched:null,error:null};
              s.qada={...(s.qada||{}),enabled:false,balances:{fajr:0,dhuhr:0,asr:0,maghrib:0,isha:0},logs:[],dailyTarget:1};
              localStorage.setItem(k,JSON.stringify(s));
            },key);
            await page.reload({waitUntil:'networkidle'});
            await page.waitForSelector('.prayerSetup',{timeout:10000});
            const prayerInputColor=await page.locator('.formGrid input').first().evaluate(el=>getComputedStyle(el).backgroundColor);
            const prayerInputRgb=(prayerInputColor.match(/\d+/g)||[]).slice(0,3).map(Number);
            if(prayerInputRgb.length<3||prayerInputRgb.some(v=>v>90))throw new Error('Prayer setup inputs regressed to a light material surface');
            await page.screenshot({path:'visual-review/06a-prayer-setup.png',fullPage:true});
            await page.click('#toggleQada');
            await page.waitForSelector('.qadaInput',{timeout:5000});
            if(await page.locator('.qadaInput').count()!==5)throw new Error('Prayer qada tracker did not render five prayer rows');
            const qadaInputColor=await page.locator('.qadaInput').first().evaluate(el=>getComputedStyle(el).backgroundColor);
            const qadaInputRgb=(qadaInputColor.match(/\d+/g)||[]).slice(0,3).map(Number);
            if(qadaInputRgb.length<3||qadaInputRgb.some(v=>v>90))throw new Error('Qada inputs regressed to a light material surface');
            await page.screenshot({path:'visual-review/06b-prayer-qada.png',fullPage:true});

            await page.evaluate((k)=>{
              const s=JSON.parse(localStorage.getItem(k));s.view='week';localStorage.setItem(k,JSON.stringify(s));
            },key);
            await page.reload({waitUntil:'networkidle'});
            await page.waitForSelector('#app .progressHero',{timeout:10000});
            const progressContrast=await page.locator('.progressHero').evaluate(el=>{
              const h1=el.querySelector('h1');
              return {
                background:getComputedStyle(el).backgroundImage,
                heading:getComputedStyle(h1).color
              };
            });
            const headingRgb=(progressContrast.heading.match(/\d+/g)||[]).slice(0,3).map(Number);
            if(!progressContrast.background.includes('linear-gradient')||headingRgb.length<3||headingRgb.some(v=>v<220))throw new Error('Premium progress hero contrast regressed');
            const progressSurface=await page.evaluate(()=>({
              chart:getComputedStyle(document.querySelector('.journeyChartCard')).backgroundImage,
              metric:getComputedStyle(document.querySelector('.journeyMetric')).backgroundImage,
              insight:getComputedStyle(document.querySelector('.periodInsight')).backgroundImage,
              track:getComputedStyle(document.querySelector('.journeyBarTrack')).backgroundColor
            }));
            if(!progressSurface.chart.includes('linear-gradient')||!progressSurface.metric.includes('linear-gradient')||!progressSurface.insight.includes('linear-gradient'))throw new Error('Progress screen regressed to mixed light material cards');
            const trackRgb=(progressSurface.track.match(/\d+/g)||[]).slice(0,3).map(Number);
            if(trackRgb.length<3||trackRgb.some(v=>v>90))throw new Error('Progress chart tracks regressed to the legacy light material');
            await page.screenshot({path:'visual-review/07-progress.png',fullPage:true});

            await page.evaluate((k)=>{
              const s=JSON.parse(localStorage.getItem(k));s.view='profile';localStorage.setItem(k,JSON.stringify(s));
            },key);
            await page.reload({waitUntil:'networkidle'});
            await page.waitForSelector('#app .pilotCard',{timeout:10000});
            const profileHero=page.locator('.profileJourneyHero[data-ui="premium-profile-v3"]');
            if(await profileHero.count()!==1)throw new Error('Premium profile journey hero missing');
            const profileHeroText=await profileHero.innerText();
            if(!profileHeroText.includes('YOLCULUĞUN')||!profileHeroText.includes('kayıtlı gün'))throw new Error('Premium profile journey summary regressed');
            const profileSettingsText=await page.locator('.profileSettingsCard').innerText();
            if(!profileSettingsText.includes('Dengeli')||!profileSettingsText.includes('Değişken günler'))throw new Error('Profile must render reader-facing Turkish labels for engine codes');
            if(profileSettingsText.includes('balanced')||profileSettingsText.includes('variable'))throw new Error('Raw engine codes leaked into Profile');
            await page.screenshot({path:'visual-review/08-profile-pilot-off.png',fullPage:true});
            page.once('dialog',dialog=>dialog.accept());
            await page.click('#pilotToggle');
            await page.waitForTimeout(350);
            const pilotState=await page.evaluate((k)=>JSON.parse(localStorage.getItem(k)).pilot,key);
            if(!pilotState?.enabled||!Array.isArray(pilotState.queue)||pilotState.queue.length<1)throw new Error('Pilot opt-in did not create a local calibration event');
            const pilotStatus=await page.evaluate(()=>fetch('/api/pilot/status').then(r=>r.json()));
            if(pilotStatus.schemaVersion!==1)throw new Error('Pilot status schema mismatch');
            await page.screenshot({path:'visual-review/08b-profile-pilot-on.png',fullPage:true});

            // Premium v3 responsive guardrails: primary Android/iPhone width band.
            for(const vp of [{width:360,height:800,name:'360'},{width:430,height:932,name:'430'}]){
              await page.setViewportSize({width:vp.width,height:vp.height});
              await page.evaluate((k)=>{
                const s=JSON.parse(localStorage.getItem(k));s.view='today';localStorage.setItem(k,JSON.stringify(s));
              },key);
              await page.reload({waitUntil:'networkidle'});
              await page.waitForSelector('.homeNightHero[data-ui="premium-home-v3"]',{timeout:10000});
              const geometry=await page.evaluate(()=>{
                const nav=document.querySelector('#nav');
                const navBox=nav?.getBoundingClientRect();
                return {
                  viewport:window.innerWidth,
                  pageWidth:document.documentElement.scrollWidth,
                  navLeft:navBox?.left??0,
                  navRight:navBox?.right??0
                };
              });
              if(geometry.pageWidth>geometry.viewport+1)throw new Error('Premium v3 horizontal overflow at '+vp.width+'px: '+geometry.pageWidth+' > '+geometry.viewport);
              if(geometry.navLeft<0||geometry.navRight>geometry.viewport+1)throw new Error('Premium v3 navigation escapes viewport at '+vp.width+'px');
              await page.screenshot({path:'visual-review/09-responsive-'+vp.name+'.png',fullPage:false});
            }

            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node capture.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: visual-review
          if-no-files-found: error
