name: Production Smoke — Premium UX V2.1

on:
  push:
    branches: ['gpt/production-smoke-b394d25']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Manevi Rota production V2.1 build
        shell: bash
        run: |
          set -euo pipefail
          base="https://manevi-rota.onrender.com"
          ready=0

          for i in {1..10}; do
            health_code="$(curl -sS -L -H 'Cache-Control: no-cache' --connect-timeout 10 --max-time 25 -o /tmp/health.json -w '%{http_code}' "$base/healthz" || true)"
            curl -fsSL -H 'Cache-Control: no-cache' "$base/?smoke=b394d25-$i" -o /tmp/index.html 2>/dev/null || true
            curl -fsSL -H 'Cache-Control: no-cache' "$base/public/styles.css?smoke=b394d25-$i" -o /tmp/styles.css 2>/dev/null || true
            curl -fsSL -H 'Cache-Control: no-cache' "$base/public/app.js?smoke=b394d25-$i" -o /tmp/app.js 2>/dev/null || true

            health_ok=0; first_impression_ok=0; nav_ok=0; v21_css_ok=0; v21_app_ok=0; closed_loop_ok=0
            [ "$health_code" = "200" ] && grep -q '"service":"manevi-rota"' /tmp/health.json && health_ok=1 || true
            grep -q 'data-first-impression="v2.1"' /tmp/index.html 2>/dev/null && first_impression_ok=1 || true
            [ "$(grep -o 'class="navGlyph"' /tmp/index.html 2>/dev/null | wc -l | tr -d ' ')" = "6" ] && nav_ok=1 || true
            grep -q 'Premium UX v2.1 — first-run setup' /tmp/styles.css 2>/dev/null && \
              grep -q 'Premium UX v2.1 — daily calibration' /tmp/styles.css 2>/dev/null && v21_css_ok=1 || true
            grep -q 'KİŞİSEL ROTA KURULUMU' /tmp/app.js 2>/dev/null && \
              grep -q 'checkinHeroCard' /tmp/app.js 2>/dev/null && \
              grep -q 'dailyCheckinCard' /tmp/app.js 2>/dev/null && \
              grep -q 'Rotayı analiz et →' /tmp/app.js 2>/dev/null && v21_app_ok=1 || true
            grep -q 'completeReadingRecommendation' /tmp/app.js 2>/dev/null && \
              grep -q 'skipReadingRecommendation' /tmp/app.js 2>/dev/null && \
              grep -q 'abandonReadingRecommendation' /tmp/app.js 2>/dev/null && \
              grep -q 'isMeaningfulRecommendationSession' /tmp/app.js 2>/dev/null && closed_loop_ok=1 || true

            echo "attempt=$i health=$health_ok first_impression=$first_impression_ok nav=$nav_ok v21_css=$v21_css_ok v21_app=$v21_app_ok closed_loop=$closed_loop_ok"
            if [ "$health_ok$first_impression_ok$nav_ok$v21_css_ok$v21_app_ok$closed_loop_ok" = "111111" ]; then
              ready=1
              break
            fi
            sleep 10
          done

          cat /tmp/health.json || true
          test "$ready" = "1"
          echo "production-smoke: Premium UX v2.1 is live"
