name: Bootstrap Manevi Rota v3

on:
  push:
    branches: [main]
    paths:
      - bootstrap.zip.b64

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Expand project payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap.zip.b64 > /tmp/manevi-rota.zip
          rm -rf /tmp/manevi-rota
          mkdir -p /tmp/manevi-rota
          unzip -q /tmp/manevi-rota.zip -d /tmp/manevi-rota
          cp -a /tmp/manevi-rota/manevi-rota-v3/. .
          rm -f bootstrap.zip.b64
          rm -f src/route-engine.mjs.bak

      - name: Commit project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: bootstrap Manevi Rota v3 production app"
          git push
