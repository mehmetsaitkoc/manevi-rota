name: Production Smoke — Render

on:
  push:
    branches: ['gpt/production-smoke-*']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Manevi Rota production
        shell: bash
        run: |
          set -euo pipefail
          base="https://manevi-rota.onrender.com"
          ready=0
          for i in {1..3}; do
            health_code="$(curl -sS -L -H 'Cache-Control: no-cache' --connect-timeout 10 --max-time 25 -o /tmp/health.json -w '%{http_code}' "$base/healthz" || true)"
            curl -fsSL -H 'Cache-Control: no-cache' "$base/public/app.js?smoke=921f105-$i" -o /tmp/app.js 2>/dev/null || true
            curl -fsSL -H 'Cache-Control: no-cache' "$base/src/reading-recommendation-memory.mjs?smoke=921f105-$i" -o /tmp/memory.mjs 2>/dev/null || true
            curl -fsSL -H 'Cache-Control: no-cache' "$base/src/today-experience.mjs?smoke=921f105-$i" -o /tmp/today.mjs 2>/dev/null || true

            health_ok=0; today_ok=0; abandon_ok=0; module_ok=0
            [ "$health_code" = "200" ] && grep -q '"service":"manevi-rota"' /tmp/health.json && health_ok=1 || true
            grep -q 'BUGÜN SANA ÖNERİM' /tmp/app.js 2>/dev/null && today_ok=1 || true
            grep -q 'abandonReadingRecommendation' /tmp/app.js 2>/dev/null && abandon_ok=1 || true
            grep -q "statuses=new Set(\['skipped','abandoned','completed'\])" /tmp/memory.mjs 2>/dev/null && grep -q 'todayExperienceSnapshot' /tmp/today.mjs 2>/dev/null && module_ok=1 || true

            echo "attempt=$i health=$health_ok today=$today_ok abandon=$abandon_ok modules=$module_ok"
            if [ "$health_ok$today_ok$abandon_ok$module_ok" = "1111" ]; then
              ready=1
              break
            fi
            sleep 5
          done

          cat /tmp/health.json || true
          test "$ready" = "1"
          echo "production-smoke: health + Today v2 + abandonment memory passed"
