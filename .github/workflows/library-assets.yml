name: Build Library Assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-library-assets.mjs'
      - '.github/workflows/library-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build local library assets
        run: node scripts/build-library-assets.mjs
      - name: Validate assets
        run: |
          test -f public/data/quran/1.json
          test -f public/data/quran/114.json
          test -f public/data/islam-dini.json
          node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('public/data/quran/2.json')); const i=JSON.parse(fs.readFileSync('public/data/islam-dini.json')); if(q.verses.length!==286) process.exit(2); if(i.pages.length<250) process.exit(3); console.log('assets validated', q.verses.length, i.pages.length)"
      - name: Commit generated assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "data: generate in-app library assets [skip library]"
            git push origin HEAD:main
          fi
      - name: Sync generated assets to gh-pages
        run: |
          git fetch origin gh-pages
          git switch gh-pages
          git checkout main -- public/data
          git add public/data
          if git diff --cached --quiet; then
            echo "gh-pages data already current"
          else
            git commit -m "deploy: sync in-app library assets"
            git push origin gh-pages
          fi
